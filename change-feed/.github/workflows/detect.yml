# Every action pinned to a full commit SHA (Master constraint).
name: Detect OpenAPI Changes
on:
  schedule: [{ cron: "30 08 * * 1-5" }]
  workflow_dispatch: {}
permissions: { contents: write, pull-requests: write }
concurrency: { group: detect, cancel-in-progress: false } # queue overlapping runs, never race the push
jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with: { go-version-file: go.mod, cache-dependency-path: go.sum }
      - run: |
          go run ./cmd/openapi-change-feed detect \
            --spec-url "https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json" \
            --out out --cursor state/cursor.json
      - name: Open or update the feed PR
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "openapi-change-feed-bot"
          git config user.email "openapi-change-feed-bot@users.noreply.github.com"
          if git diff --quiet -- state out; then echo "no changes"; exit 0; fi
          BRANCH="feed/auto-update"
          git switch -C "$BRANCH"
          git add state out
          git commit -m "chore: update change feed"
          git push --force-with-lease origin "$BRANCH"
          gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q . \
            || gh pr create --head "$BRANCH" --base main \
                 --title "chore: update REST API change feed" \
                 --body "Automated change-feed update. Review out/report.md for the human-readable diff."
