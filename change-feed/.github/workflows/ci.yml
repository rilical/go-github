name: CI
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build-test:
    strategy: { matrix: { go-version: ["1.26.x", "stable"] } }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with: { go-version: "${{ matrix.go-version }}", cache-dependency-path: go.sum }
      - run: go build ./...
      - run: go test -race ./...
  # Dedicated anchor job: fetches the real 12MB spec pair and runs the pinned regression with
  # ANCHOR_REQUIRED=1 so it FAILS (never skips) if the specs or counts drift. This is what stops
  # the 348/36/70/242 guard from silently skipping forever.
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with: { go-version-file: go.mod, cache-dependency-path: go.sum }
      - run: bash script/fetch-anchor.sh
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: ANCHOR_REQUIRED=1 go test ./internal/detector -run TestAnchorWindowPinnedCounts -v
